[package]
name = "stoffelnet-nat-integration"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
stoffelnet = { path = "../.." }
tokio = { version = "1.46.1", features = ["full"] }
quinn = "0.11.8"
rustls = "0.23.29"
rcgen = "0.14.2"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
byteorder = "1.5"
rand = "0.9"

[[bin]]
name = "nat_test_peer"
path = "src/nat_test_peer.rs"

[[bin]]
name = "nat_signaling_server"
path = "src/signaling_server.rs"

[[bin]]
name = "nat_stun_server"
path = "src/stun_server.rs"
